services:
  postgres:
    image: postgres:17-alpine
    container_name: tracker-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set in backend/.env}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME must be set in backend/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in backend/.env}
    ports:
      - "${DB_PORT:?DB_PORT must be set in backend/.env}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
